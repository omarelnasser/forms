<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Registration Form</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
.form-group { margin-bottom: 1rem; }
.input-field {
width: 100%; padding: 0.75rem 1rem;
border: 1px solid #d1d5db; border-radius: 0.375rem;
transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
}
.input-field:focus {
border-color: #3b82f6;
box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
outline: none;
}
.phone-input-group { display: flex; gap: 0.5rem; align-items: center; }
.country-select-wrapper {
position: relative; flex-shrink: 0; display: flex; align-items: center;
}
.flag-icon {
position: absolute; left: 10px; width: 20px; height: 14px; object-fit: cover;
}
.country-code-select {
padding-left: 2.2rem; /* room for flag */
width: 110px; appearance: none;
}
.phone-number-input { flex-grow: 1; }
/* Hide additional fields initially */
#extendedFields { display: none; }
</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
<div id="formContainer" class="w-full max-w-2xl bg-white shadow-xl rounded-lg p-8">
<h2 id="formTitle" class="text-3xl font-bold text-center text-gray-800 mb-6">User Registration</h2>
<p id="formSubtitle" class="text-center text-gray-500 mb-8">Please enter your email to get started.</p>

<form id="myForm" class="space-y-6">
<input type="hidden" id="formid" />

<div class="form-group">
<label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
<input type="email" id="email" placeholder="Enter your personal email" required class="input-field" />
</div>

<button type="button" id="nextBtn" class="w-full py-3 mt-4 text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition">
Next
</button>

<div id="extendedFields">
<h3 class="text-xl font-semibold text-gray-700 border-b pb-2 mb-4">Your Details</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="form-group">
<label for="firstname" class="block text-sm font-medium text-gray-700">First Name</label>
<input type="text" id="firstname" placeholder="" class="input-field" pattern="^[^\s]+$" title="No spaces allowed" />
</div>
<div class="form-group">
<label for="lastname" class="block text-sm font-medium text-gray-700">Last Name</label>
<input type="text" id="lastname" placeholder="" class="input-field" pattern="^[^\s]+$" title="No spaces allowed" />
</div>
</div>

<div class="form-group">
<label for="dob" class="block text-sm font-medium text-gray-700">Date of Birth</label>
<input type="date" id="dob" class="input-field" />
</div>

<div class="form-group">
<label for="country_code" class="block text-sm font-medium text-gray-700">Phone Number</label>
<div class="phone-input-group">
<div class="country-select-wrapper">
<img id="flag_user" class="flag-icon" src="" alt="">
<select id="country_code" class="input-field country-code-select">
 <option value="">Code</option>
 <option data-flag="https://flagcdn.com/w20/eg.png" value="+20">+20 (Egypt)</option>
 <option data-flag="https://flagcdn.com/w20/sd.png" value="+249">+249 (Sudan)</option>
 <option data-flag="https://flagcdn.com/w20/sa.png" value="+966">+966 (Saudi Arabia)</option>
 <option data-flag="https://flagcdn.com/w20/ae.png" value="+971">+971 (UAE)</option>
 <option data-flag="https://flagcdn.com/w20/bh.png" value="+973">+973 (Bahrain)</option>
 <option data-flag="https://flagcdn.com/w20/om.png" value="+968">+968 (Oman)</option>
 <option data-flag="https://flagcdn.com/w20/kw.png" value="+965">+965 (Kuwait)</option>
 <option data-flag="https://flagcdn.com/w20/qa.png" value="+974">+974 (Qatar)</option>
</select>
</div>
<input type="tel" id="number" placeholder="Enter phone number" class="input-field phone-number-input" />
</div>
</div>

<h3 class="text-xl font-semibold text-gray-700 border-b pb-2 mb-4 mt-8">Parent/Guardian Details</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="form-group">
<label for="parentfirstname" class="block text-sm font-medium text-gray-700">Parent First Name</label>
<input type="text" id="parentfirstname" placeholder="" class="input-field" pattern="^[^\s]+$" title="No spaces allowed" />
 </div>
<div class="form-group">
<label for="parentlastname" class="block text-sm font-medium text-gray-700">Parent Last Name</label>
<input type="text" id="parentlastname" placeholder="" class="input-field" pattern="^[^\s]+$" title="No spaces allowed" />
</div>
</div>

<div class="form-group">
<label for="parentemail" class="block text-sm font-medium text-gray-700">Parent Email Address</label>
<input type="email" id="parentemail" placeholder="" class="input-field" />
</div>

<div class="form-group">
<label for="parent_country_code" class="block text-sm font-medium text-gray-700">Parent Phone Number</label>
<div class="phone-input-group">
<div class="country-select-wrapper">
<img id="flag_parent" class="flag-icon" src="" alt="">
<select id="parent_country_code" class="input-field country-code-select">
 <option value="">Code</option>
 <option data-flag="https://flagcdn.com/w20/eg.png" value="+20">+20 (Egypt)</option>
 <option data-flag="https://flagcdn.com/w20/sd.png" value="+249">+249 (Sudan)</option>
 <option data-flag="https://flagcdn.com/w20/sa.png" value="+966">+966 (Saudi Arabia)</option>
 <option data-flag="https://flagcdn.com/w20/ae.png" value="+971">+971 (UAE)</option>
 <option data-flag="https://flagcdn.com/w20/bh.png" value="+973">+973 (Bahrain)</option>
 <option data-flag="https://flagcdn.com/w20/om.png" value="+968">+968 (Oman)</option>
 <option data-flag="https://flagcdn.com/w20/kw.png" value="+965">+965 (Kuwait)</option>
 <option data-flag="https://flagcdn.com/w20/qa.png" value="+974">+974 (Qatar)</option>
</select>
</div>
<input type="tel" id="parentnumber" placeholder="Enter phone number" class="input-field phone-number-input" />
</div>
</div>

<button type="submit" class="w-full py-3 mt-4 text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
Submit Registration
</button>
</div>

<div class="mt-4 text-center text-sm text-gray-600">
 <p>If you need support, contact us via WhatsApp:</p>
 <a href="https://wa.me/201093022198" target="_blank" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-medium">
   Contact Support
    <i class="fab fa-whatsapp text-green-500 text-xl ml-2"></i>
 </a>
</div>
</form>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const supabaseUrl = 'https://qxluetvkqxillhqsbubl.supabase.co'
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4bHVldHZrcXhpbGxocXNidWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzM5MzIwNTMsImV4cCI6MjA0OTUwODA1M30.11cD0yE0aJW1OIx0kB4EaWtCvg5nUkj-0QuTVk-C7zg'
const supabase = createClient(supabaseUrl, supabaseKey)

const urlParams = new URLSearchParams(window.location.search)
const formCode = urlParams.get('code')
const formIdInput = document.getElementById('formid')
const formTitleElement = document.getElementById('formTitle')
const formContainer = document.getElementById('formContainer')
const nextBtn = document.getElementById('nextBtn')
const extendedFields = document.getElementById('extendedFields')
const emailInput = document.getElementById('email')

const checkFormCode = async () => {
if (!formCode) {
formIdInput.value = 'default'
return
}

const { data, error } = await supabase
.from('forms')
.select('id, title')
.eq('subjectid', formCode)
.limit(1)
.single()

if (error && error.code !== 'PGRST116') {
console.error('Supabase Error:', error)
formContainer.innerHTML = '<div class="text-center p-10"><h2 class="text-3xl font-bold text-red-600 mb-4">Error</h2><p class="text-gray-700">An unexpected error occurred.</p></div>'
return
}

if (data) {
formIdInput.value = data.id
document.title = data.title
formTitleElement.textContent = data.title
} else {
formContainer.innerHTML = '<div class="text-center p-10"><h2 class="text-3xl font-bold text-red-600 mb-4">Form Not Found</h2></div>'
}
}

checkFormCode()

// Step 1: Check Email Logic
nextBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim().toLowerCase()
    if (!validateEmail(email)) {
        alert('Please enter a valid email address.')
        return
    }

    nextBtn.disabled = true
    nextBtn.textContent = 'Checking...'

    // Check if email exists in students table
    const { data: student, error } = await supabase
        .from('students')
        .select('*')
        .eq('email', email)
        .single()

    if (student) {
        // Registered! Add to form_submissions automatically
        const submissionData = {
            firstname: student.firstname,
            lastname: student.lastname,
            email: student.email,
            number: student.number,
            parentfirstname: student.parentfirstname,
            parentlastname: student.parentlastname,
            parentemail: student.parentemail,
            parentnumber: student.parentnumber,
            dob: student.dob,
            formid: formIdInput.value
        }

        const { error: insError } = await supabase.from('form_submissions').insert([submissionData])
        
        if (insError && insError.code === '23505') {
            alert('✅ You are already registered for this subject!')
        } else if (insError) {
            alert('Error: ' + insError.message)
        } else {
            formContainer.innerHTML = `
                <div class="text-center p-10">
                    <i class="fas fa-check-circle text-green-500 text-6xl mb-4"></i>
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Registration Complete</h2>
                    <p class="text-gray-600">Welcome back ${student.firstname}! You are already registered in our system, and your entry has been recorded.</p>
                </div>`
        }
    } else {
        // Not registered: Show full form
        nextBtn.style.display = 'none'
        extendedFields.style.display = 'block'
        document.getElementById('formSubtitle').textContent = "Email not found. Please complete your registration below."
        // Make fields required now that they are visible
        const inputs = extendedFields.querySelectorAll('input, select')
        inputs.forEach(input => { if(input.type !== 'hidden') input.required = true })
    }
})

const phoneRules = {
'+20': 10, '+249': 9, '+971': 9, '+966': 9, '+973': 8, '+968': 8, '+965': 8, '+974': 8
}

const setupPhoneInput = (selectId, inputId, flagId) => {
const select = document.getElementById(selectId)
const input = document.getElementById(inputId)
const flag = document.getElementById(flagId)

select.addEventListener('change', () => {
const selected = select.options[select.selectedIndex]
const countryCode = select.value
const flagUrl = selected.getAttribute('data-flag')
flag.src = flagUrl || ''
const ruleLength = phoneRules[countryCode]

if (ruleLength) {
 input.value = ''
 input.maxLength = ruleLength
 input.placeholder = `${'X'.repeat(ruleLength)} (${ruleLength} digits)`
} else {
 input.value = ''
 input.maxLength = 15
 input.placeholder = "Enter phone number"
}
})
}

setupPhoneInput('country_code', 'number', 'flag_user')
setupPhoneInput('parent_country_code', 'parentnumber', 'flag_parent')

const validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
const capitalize = (str) => str.charAt(0).toUpperCase() + str.slice(1).toLowerCase()

const validatePhoneNumber = (countryCode, numberInputId) => {
const input = document.getElementById(numberInputId)
const value = input.value.trim()
const ruleLength = phoneRules[countryCode]
if (ruleLength && value.length !== ruleLength) {
alert(`❌ Phone number for ${countryCode} must be exactly ${ruleLength} digits long.`)
input.focus()
return false
}
return true
}

const isOlderThan14 = (dobString) => {
const today = new Date()
const dob = new Date(dobString)
let age = today.getFullYear() - dob.getFullYear()
const m = today.getMonth() - dob.getMonth()
if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) { age-- }
return age >= 14
}

document.getElementById('myForm').addEventListener('submit', async (e) => {
e.preventDefault()

let firstname = capitalize(document.getElementById('firstname').value.trim())
let lastname = capitalize(document.getElementById('lastname').value.trim())
let email = document.getElementById('email').value.trim().toLowerCase()
const countryCode = document.getElementById('country_code').value
const studentNumberOnly = document.getElementById('number').value.trim()
const number = countryCode + studentNumberOnly
let parentfirstname = capitalize(document.getElementById('parentfirstname').value.trim())
let parentlastname = capitalize(document.getElementById('parentlastname').value.trim())
let parentemail = document.getElementById('parentemail').value.trim().toLowerCase()
const parentCountryCode = document.getElementById('parent_country_code').value
const parentNumberOnly = document.getElementById('parentnumber').value.trim()
const parentnumber = parentCountryCode + parentNumberOnly
const dob = document.getElementById('dob').value
const formid = document.getElementById('formid').value

if ([firstname, lastname, parentfirstname, parentlastname].some(n => n.includes(' '))) {
alert('❌ Names cannot contain spaces.')
return
}

if (!validatePhoneNumber(countryCode, 'number') || !validatePhoneNumber(parentCountryCode, 'parentnumber')) return

if (email === parentemail) {
alert('❌ Parent Email cannot be the same as Student Email.')
return
}

if (number === parentnumber) {
alert('❌ Parent Phone cannot be the same as Student Phone.')
return
}

if (!isOlderThan14(dob)) {
alert('❌ Student must be 14 years or older.')
return
}

const submissionData = {
firstname, lastname, email, number,
parentfirstname, parentlastname, parentemail, parentnumber,
dob, formid
}

const { error } = await supabase.from('form_submissions').insert([submissionData])
if (error) {
 if (error.code === '23505') alert('❌ This student has already filled the form before.')
 else alert('❌ Error: ' + error.message)
} else {
alert('✅ Registration submitted successfully!')
window.location.reload()
}
})
</script>
</body>
</html>
