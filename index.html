<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Registration Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @font-face {
            font-family: 'Feathers';
            src: url('Feathers.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'Feathers', sans-serif;
        }
        .form-group { margin-bottom: 1rem; }
        .input-field {
            width: 100%; padding: 0.75rem 1rem;
            border: 1px solid #d1d5db; border-radius: 0.375rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            background-color: #ffffff;
        }
        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
            outline: none;
        }
        .phone-input-group { display: flex; gap: 0.5rem; align-items: center; }
        .country-select-wrapper {
            position: relative; flex-shrink: 0; display: flex; align-items: center;
        }
        .flag-icon {
            position: absolute; left: 10px; width: 20px; height: 14px; object-fit: cover;
        }
        .country-code-select {
            padding-left: 2.2rem;
            width: 110px; appearance: none;
        }
        .phone-number-input { flex-grow: 1; }
        #extendedFields, #verificationSection { display: none; }
        
        /* Fixed sizing properties to force equal heights despite varying asset dimensions */
        .store-badge {
            height: 40px !important;
            width: auto !important;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 text-slate-800">
    <div id="formContainer" class="w-full max-w-2xl bg-white shadow-xl rounded-2xl p-8 my-8 border border-slate-100">
        <div class="flex justify-center mb-6">
            <img src="icon.png" alt="App Icon" class="h-20 w-20 object-contain rounded-xl" />
        </div>

        <!-- Integrated Unified Semi-Transparent Container Wrapper Block -->
        <div id="courseDetailsWrapper" class="rounded-2xl border p-6 pt-8 mb-6 relative overflow-hidden transition-all duration-300">
            <!-- Dynamic Profile/Session View Header -->
            <div id="dynamicHeaderSection" class="mb-6 hidden">
                <div id="courseCardHeader" class="relative">
                    <!-- Top Status Badge -->
                    <span id="headerBadge" class="absolute top-0 right-0 text-[11px] font-extrabold px-3 py-1 rounded-full text-white tracking-wider uppercase shadow-sm z-10">
                        Live
                    </span>
                    
                    <div class="flex flex-col sm:flex-row items-center gap-5 border-b border-slate-100 pb-6">
                        <!-- Left: Profile Picture Container -->
                        <div id="headerProfilePicContainer" class="flex-shrink-0"></div>

                        <!-- Right: Course Details Summary -->
                        <div class="flex-1 text-center sm:text-left space-y-2 w-full">
                            <div>
                                <h4 id="headerTeacherLabel" class="text-xl font-bold text-slate-800 tracking-tight"></h4>
                                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mt-0.5">Course Instructor</p>
                            </div>

                            <!-- Styled Information Grid -->
                            <div class="grid grid-cols-2 gap-2 pt-2 text-xs font-medium text-slate-600">
                                <div class="bg-white/60 rounded-lg p-2 border border-slate-100/70 shadow-sm">
                                    <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-wide">Board</span>
                                    <span id="headerBoardLabel" class="text-slate-700 font-semibold truncate block mt-0.5"></span>
                                </div>
                                <div class="bg-white/60 rounded-lg p-2 border border-slate-100/70 shadow-sm">
                                    <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-wide">Level</span>
                                    <span id="headerLevelLabel" class="text-slate-700 font-semibold truncate block mt-0.5"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Static Fallback Element used explicitly by success alert strings to prevent crashes -->
            <h2 id="formTitle" class="hidden">User Registration</h2>
            <p id="formSubtitle" class="text-center text-gray-500 mb-8">Enter your personal email to check your registration status.</p>

            <form id="myForm" class="space-y-6">
                <input type="hidden" id="formid" />

                <div class="form-group">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="firstname" class="block text-sm font-medium text-gray-700">First Name</label>
                            <input type="text" id="firstname" class="input-field" pattern="^[^\s]+$" title="No spaces allowed" />
                        </div>
                        <div class="form-group">
                            <label for="lastname" class="block text-sm font-medium text-gray-700">Last Name</label>
                            <input type="text" id="lastname" class="input-field" pattern="^[^\s]+$" title="No spaces allowed" />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="password" class="block text-sm font-medium text-gray-700">Create Password</label>
                            <input type="password" id="password" class="input-field" minlength="6" />

                            <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                            <input type="password" id="confirmPassword" class="input-field" minlength="6" />

                    </div>

                    <div class="form-group">
                        <label for="dob" class="block text-sm font-medium text-gray-700">Date of Birth</label>
                        <input type="date" id="dob" class="input-field" />
                    </div>

                    <div class="form-group">
                        <label for="country_code" class="block text-sm font-medium text-gray-700">Phone Number</label>
                        <div class="phone-input-group">
                            <div class="country-select-wrapper">
                                <img id="flag_user" class="flag-icon" src="" alt="">
                                <select id="country_code" class="input-field country-code-select">
                                    <option value="">Code</option>
                                    <option data-flag="https://flagcdn.com/w20/eg.png" value="+20">+20 (Egypt)</option>
                                    <option data-flag="https://flagcdn.com/w20/sd.png" value="+249">+249 (Sudan)</option>
                                    <option data-flag="https://flagcdn.com/w20/sa.png" value="+966">+966 (Saudi Arabia)</option>
                                    <option data-flag="https://flagcdn.com/w20/ae.png" value="+971">+971 (UAE)</option>
                                    <option data-flag="https://flagcdn.com/w20/bh.png" value="+973">+973 (Bahrain)</option>
                                    <option data-flag="https://flagcdn.com/w20/om.png" value="+968">+968 (Oman)</option>
                                    <option data-flag="https://flagcdn.com/w20/kw.png" value="+965">+965 (Kuwait)</option>
                                    <option data-flag="https://flagcdn.com/w20/qa.png" value="+974">+974 (Qatar)</option>
                                </select>
                            </div>
                            <input type="tel" id="number" placeholder="Enter phone number" class="input-field phone-number-input" />
                        </div>
                    </div>

                    <h3 class="text-xl font-semibold text-gray-700 border-b pb-2 mb-4 mt-8">Parent/Guardian Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="parentfirstname" class="block text-sm font-medium text-gray-700">Parent First Name</label>
                            <input type="text" id="parentfirstname" class="input-field" pattern="^[^\s]+$" title="No spaces allowed" />
                        </div>
                        <div class="form-group">
                            <label for="parentlastname" class="block text-sm font-medium text-gray-700">Parent Last Name</label>
                            <input type="text" id="parentlastname" class="input-field" pattern="^[^\s]+$" title="No spaces allowed" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="parentemail" class="block text-sm font-medium text-gray-700">Parent Email Address</label>
                        <input type="email" id="parentemail" class="input-field" />
                    </div>

                    <div class="form-group">
                        <label for="parent_country_code" class="block text-sm font-medium text-gray-700">Parent Phone Number</label>
                        <div class="phone-input-group">
                            <div class="country-select-wrapper">
                                <img id="flag_parent" class="flag-icon" src="" alt="">
                                <select id="parent_country_code" class="input-field country-code-select">
                                    <option value="">Code</option>
                                    <option data-flag="https://flagcdn.com/w20/eg.png" value="+20">+20 (Egypt)</option>
                                    <option data-flag="https://flagcdn.com/w20/sd.png" value="+249">+249 (Sudan)</option>
                                    <option data-flag="https://flagcdn.com/w20/sa.png" value="+966">+966 (Saudi Arabia)</option>
                                    <option data-flag="https://flagcdn.com/w20/ae.png" value="+971">+971 (UAE)</option>
                                    <option data-flag="https://flagcdn.com/w20/bh.png" value="+973">+973 (Bahrain)</option>
                                    <option data-flag="https://flagcdn.com/w20/om.png" value="+968">+968 (Oman)</option>
                                    <option data-flag="https://flagcdn.com/w20/kw.png" value="+965">+965 (Kuwait)</option>
                                    <option data-flag="https://flagcdn.com/w20/qa.png" value="+974">+974 (Qatar)</option>
                                </select>
                            </div>
                            <input type="tel" id="parentnumber" placeholder="Enter phone number" class="input-field phone-number-input" />
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full py-3 mt-4 text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition">
                        Submit Registration
                    </button>
                </div>
            </form>

            <div id="verificationSection" class="space-y-6">
                <div class="text-center">
                    <i class="fas fa-envelope-open-text text-blue-500 text-5xl mb-4"></i>
                    <h3 class="text-2xl font-bold text-gray-800">Verify Your Email</h3>
                    <p class="text-gray-600 mt-2">We sent a 6-digit code to <span id="displayEmail" class="font-bold"></span></p>
                </div>
                <div class="form-group">
                    <input type="text" id="otpCode" placeholder="Enter 6-digit code" class="input-field text-center text-2xl tracking-widest" maxlength="6" />
                </div>
                <button type="button" id="verifyBtn" class="w-full py-3 text-white bg-green-600 rounded-lg hover:bg-green-700 transition">
                    Verify & Complete
                </button>
                <div class="text-center">
                    <button type="button" id="resendBtn" class="text-blue-600 hover:underline text-sm font-medium">
                        Resend Code
                    </button>
                    <p id="timerDisplay" class="text-gray-400 text-xs mt-1"></p>
                </div>
            </div>

            <div id="supportSection" class="mt-8 text-center text-sm text-gray-600 border-t pt-6">
                <p>If you need support, contact us via WhatsApp:</p>
                <a href="https://wa.me/201093022198" target="_blank" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-medium mt-1">
                    Contact Support <i class="fab fa-whatsapp text-green-500 text-xl ml-2"></i>
                </a>
            </div>
        </div>

        <div class="flex justify-center items-center gap-4 pt-2">
            <a href="https://apps.apple.com/eg/app/igeni/id6752439689" target="_blank" class="inline-block transition-transform duration-200 hover:scale-105">
                <img src="appstore.png" alt="Download on the App Store" class="store-badge" />
            </a>
            <a href="https://play.google.com/store/apps/details?id=app.android.igeni&pcampaignid=web_share" target="_blank" class="inline-block transition-transform duration-200 hover:scale-105">
                <img src="playstore.png" alt="Get it on Google Play" class="store-badge" />
            </a>
        </div>
    </div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const supabaseUrl = 'https://qxluetvkqxillhqsbubl.supabase.co'
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4bHVldHZrcXhpbGxocXNidWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzM5MzIwNTMsImV4cCI6MjA0OTUwODA1M30.11cD0yE0aJW1OIx0kB4EaWtCvg5nUkj-0QuTVk-C7zg'
const supabase = createClient(supabaseUrl, supabaseKey)

const urlParams = new URLSearchParams(window.location.search)
const formCode = urlParams.get('code')
const formIdInput = document.getElementById('formid')
const formTitleElement = document.getElementById('formTitle')
const formContainer = document.getElementById('formContainer')
const nextBtn = document.getElementById('nextBtn')
const extendedFields = document.getElementById('extendedFields')
const emailInput = document.getElementById('email')
const supportHtml = document.getElementById('supportSection').outerHTML
const verificationSection = document.getElementById('verificationSection')
const resendBtn = document.getElementById('resendBtn')
const timerDisplay = document.getElementById('timerDisplay')

let resendTimer = 0;
const phoneRules = {'+20': 10, '+249': 9, '+971': 9, '+966': 9, '+973': 8, '+968': 8, '+965': 8, '+974': 8}

const validateEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)
const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase()

const isOlderThan14 = (dob) => {
    const today = new Date(); const birthDate = new Date(dob)
    let age = today.getFullYear() - birthDate.getFullYear()
    const m = today.getMonth() - birthDate.getMonth()
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--
    return age >= 14
}

const generateRandomNumericPassword = () => {
    const min = 100000;
    const max = 999999;
    return Math.floor(min + Math.random() * (max - min)).toString();
}

const startTimer = () => {
    resendTimer = 60;
    resendBtn.disabled = true;
    resendBtn.classList.add('text-gray-400', 'cursor-not-allowed');
    const interval = setInterval(() => {
        if (resendTimer <= 0) {
            clearInterval(interval);
            resendBtn.disabled = false;
            resendBtn.classList.remove('text-gray-400', 'cursor-not-allowed');
            timerDisplay.textContent = "";
        } else {
            timerDisplay.textContent = `You can resend in ${resendTimer}s`;
            resendTimer--;
        }
    }, 1000);
}

const goToVerification = (email) => {
    document.getElementById('myForm').style.display = 'none';
    verificationSection.style.display = 'block';
    document.getElementById('displayEmail').textContent = email;
    document.getElementById('formSubtitle').textContent = "Verify your account to complete registration.";
    startTimer();
}

const showFinalSuccess = (name) => {
    const title = formTitleElement.innerText || "the subject"
    formContainer.innerHTML = `
        <div class="text-center p-10">
            <i class="fas fa-check-circle text-green-500 text-6xl mb-4"></i>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Registration Success</h2>
            <p class="text-gray-600 text-lg">You have successfully registered to <strong>${title}</strong>.</p>
            <p class="text-gray-500 mt-4">The classroom will appear inside the IGeni app once admitted by the teacher.</p>
            <p class="text-blue-600 font-bold mt-6">Happy Learning, ${name}!</p>
            ${supportHtml}
        </div>`
}

const showAlreadyRegistered = () => {
    const title = formTitleElement.innerText || "the subject"
    formContainer.innerHTML = `
        <div class="text-center p-10">
            <i class="fas fa-info-circle text-blue-500 text-6xl mb-4"></i>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Already Registered</h2>
            <p class="text-gray-600 text-lg">You have already registered to <strong>${title}</strong>.</p>
            <p class="text-gray-500 mt-4">Once admitted, you will see the classroom in the IGeni App homepage.</p>
            <div class="mt-8">
                ${supportHtml}
            </div>
        </div>`
}

const showCourseExpired = () => {
    const title = formTitleElement.innerText || "this subject"
    formContainer.innerHTML = `
        <div class="text-center p-10">
            <i class="fas fa-exclamation-triangle text-orange-500 text-6xl mb-4"></i>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Course Expired</h2>
            <p class="text-gray-600 text-lg">Registration for <strong>${title}</strong> has closed because this course has ended.</p>
            <div class="mt-8">
                ${supportHtml}
            </div>
        </div>`
}

const showFormClosed = (title) => {
    formContainer.innerHTML = `
        <div class="text-center p-10">
            <i class="fas fa-lock text-red-500 text-6xl mb-4"></i>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Registration Closed</h2>
            <p class="text-gray-600 text-lg">This form is no longer accepting registrations for <strong>${title}</strong>.</p>
            <div class="mt-8">
                ${supportHtml}
            </div>
        </div>`
}

const showFormFields = () => {
    nextBtn.style.display = 'none'; 
    extendedFields.style.display = 'block';
    document.getElementById('formSubtitle').textContent = "Complete your registration details.";
    extendedFields.querySelectorAll('input, select').forEach(el => { 
        if(el.type !== 'hidden') el.required = true; 
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "'");
}

const checkFormCode = async () => {
    if (!formCode) { formIdInput.value = 'default'; return }
    
    formIdInput.value = formCode;

    // Fetch matching details including sublevel column
    const { data: subjectData } = await supabase.from('subjects').select('subname, ended, lastdate, code, board, color, level, sublevel, form_on, teachers(firstname, lastname, profilepicture, title)').eq('id', formCode).maybeSingle()
    
    if (subjectData) {
        document.title = subjectData.subname || "Live Course";
        formTitleElement.innerText = subjectData.subname || "Live Course";
        
        if (subjectData.form_on === false) {
            showFormClosed(subjectData.subname || "this course");
            return;
        }

        const isEnded = subjectData.ended ?? false;
        let isExpired = false;
        if (subjectData.lastdate) {
            try {
                const lastDate = new Date(subjectData.lastdate);
                if (lastDate < new Date()) {
                    isExpired = true;
                }
            } catch (_) {}
        }
        if (isEnded || isExpired) {
            showCourseExpired();
            return;
        }

        let teacherLabel = 'No Instructor Assigned';
        let profilePicMarkup = `
            <div class="w-20 h-20 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-2xl shadow-inner mx-auto">
                <i class="fas fa-user-tie"></i>
            </div>
        `;

        if (subjectData.teachers) {
            const titlePrefix = subjectData.teachers.title ? `${subjectData.teachers.title} ` : '';
            const first = subjectData.teachers.firstname || '';
            const last = subjectData.teachers.lastname || '';
            const full = `${first} ${last}`.trim();
            if (full) {
                teacherLabel = `${titlePrefix}${full}`;
            }

            if (subjectData.teachers.profilepicture && subjectData.teachers.profilepicture.trim() !== '') {
                profilePicMarkup = `
                    <img src="${subjectData.teachers.profilepicture}" alt="${escapeHtml(full)}" class="w-20 h-20 rounded-full object-cover border-2 border-white shadow-md mx-auto" onerror="this.outerHTML='<div class=\'w-20 h-20 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-2xl shadow-inner mx-auto\'><i class=\'fas fa-user-graduate\'></i></div>'"/>
                `;
            } else if (full) {
                const initials = (first.charAt(0) + last.charAt(0)).toUpperCase();
                profilePicMarkup = `
                    <div class="w-20 h-20 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 font-bold text-lg border border-blue-100 shadow-sm mx-auto">
                        ${escapeHtml(initials)}
                    </div>
                `;
            }
        }

        const customHexColor = (subjectData.color && subjectData.color.trim() !== '') ? subjectData.color : '#3b82f6';
        const sessionTag = subjectData.code ? escapeHtml(subjectData.code) : 'Live';

        document.getElementById('headerProfilePicContainer').innerHTML = profilePicMarkup;
        document.getElementById('headerTeacherLabel').innerText = teacherLabel;
        
        // Setting Board name and dynamically updating layout details to keep it beautiful
        const boardElement = document.getElementById('headerBoardLabel');
        boardElement.innerText = (subjectData.board || 'General');
        boardElement.classList.remove('hidden'); // Making sure board text element stays active in our revised arrangement layout Block
        
        // Appends " - sublevel" conditionally if data exists
        let levelText = subjectData.level || 'N/A';
        if (subjectData.sublevel) {
            levelText += ` - ${subjectData.sublevel}`;
        }
        document.getElementById('headerLevelLabel').innerText = levelText;
        
        document.getElementById('headerBadge').innerText = sessionTag;
        document.getElementById('headerBadge').style.backgroundColor = customHexColor;

        const courseDetailsWrapper = document.getElementById('courseDetailsWrapper');
        courseDetailsWrapper.style.borderColor = `${customHexColor}40`;
        courseDetailsWrapper.style.backgroundColor = `${customHexColor}0a`;

        document.getElementById('dynamicHeaderSection').classList.remove('hidden');
    }
}
checkFormCode()

nextBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim().toLowerCase()
    if (!validateEmail(email)) return alert('❌ Please enter a valid email address.')
    
    nextBtn.disabled = true; nextBtn.textContent = 'Checking...'

    const { data: student } = await supabase.from('students')
        .select('id, firstname, is_confirmed')
        .eq('email', email)
        .maybeSingle()

    if (student) {
        if (student.is_confirmed === false) {
            const { error: resendErr } = await supabase.auth.resend({ type: 'signup', email: email });
            if (resendErr) {
                showFormFields();
            } else {
                alert("A new verification code has been sent to your email.");
                goToVerification(email);
            }
            return;
        }

        const { data: enrollment } = await supabase.from('studentsubjects')
            .select('studentemail')
            .eq('studentemail', email)
            .eq('subjectid', formCode)
            .maybeSingle()

        if (enrollment) {
            showAlreadyRegistered();
        } else {
            await supabase.from('studentsubjects').insert([{
                studentemail: email,
                student_id: student.id,
                subjectid: formCode,
                is_admitted: false
            }])
            showFinalSuccess(student.firstname)
        }
    } else {
        showFormFields();
    }
})

const setupPhoneInput = (selectId, inputId, flagId) => {
    const select = document.getElementById(selectId); const input = document.getElementById(inputId); const flag = document.getElementById(flagId)
    select.addEventListener('change', () => {
        const selected = select.options[select.selectedIndex]; const rule = phoneRules[select.value]
        flag.src = selected.getAttribute('data-flag') || ''
        if (rule) { input.maxLength = rule; input.placeholder = `${'X'.repeat(rule)} (${rule} digits)` }
    })
}
setupPhoneInput('country_code', 'number', 'flag_user')
setupPhoneInput('parent_country_code', 'parentnumber', 'flag_parent')

document.getElementById('myForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    
    const pass = document.getElementById('password').value
    const confirmPass = document.getElementById('confirmPassword').value
    const studentEmail = emailInput.value.trim().toLowerCase()
    const parentEmail = document.getElementById('parentemail').value.trim().toLowerCase()
    const dob = document.getElementById('dob').value
    
    const fn = capitalize(document.getElementById('firstname').value.trim())
    const ln = capitalize(document.getElementById('lastname').value.trim())
    const pfn = capitalize(document.getElementById('parentfirstname').value.trim())
    const pln = capitalize(document.getElementById('parentlastname').value.trim())
    const sFullNum = document.getElementById('country_code').value + document.getElementById('number').value.trim()
    const pFullNum = document.getElementById('parent_country_code').value + document.getElementById('parentnumber').value.trim()

    if (pass !== confirmPass) return alert('❌ Passwords do not match.')
    if (pass.length < 6) return alert('❌ Password must be at least 6 characters.')
    if (studentEmail === parentEmail) return alert('❌ Parent Email cannot be the same as Student Email.')
    if (!isOlderThan14(dob)) return alert('❌ Student must be at least 14 years old.')

    const submitBtn = document.getElementById('submitBtn')
    submitBtn.disabled = true; submitBtn.textContent = "Processing..."

    try {
        let parentId;
        const { data: existingParent } = await supabase.from('parents').select('id').eq('parentemail', parentEmail).maybeSingle();
        if (existingParent) {
            parentId = existingParent.id;
        } else {
            const parentGeneratedPassword = generateRandomNumericPassword();
            
            const { error: pAuthErr } = await supabase.auth.signUp({
                phone: pFullNum,
                password: parentGeneratedPassword,
                options: {
                    data: {
                        email: parentEmail
                    }
                }
            });
            if (pAuthErr) throw pAuthErr;

            const { data: newParent, error: pErr } = await supabase.from('parents').insert([{
                parentfirstname: pfn, 
                parentlastname: pln, 
                parentemail: parentEmail, 
                parentnumber: pFullNum,
                password: parentGeneratedPassword,
                wp_sent: false
            }]).select().single();
            if (pErr) throw pErr;
            parentId = newParent.id;
        }

        const { data: newStudent, error: sErr } = await supabase.from('students').insert([{
            email: studentEmail,
            firstname: fn,
            lastname: ln,
            phonenumber: sFullNum,
            dob: dob,
            parent_id: parentId,
            parentemail: parentEmail,
            is_confirmed: false 
        }]).select().single();
        if (sErr) throw sErr;

        await supabase.from('studentsubjects').insert([{
            studentemail: studentEmail,
            student_id: newStudent.id,
            subjectid: formCode,
            is_admitted: false
        }]);

        const { error: authError } = await supabase.auth.signUp({
            email: studentEmail,
            password: pass
        })
        if (authError) throw authError;

        goToVerification(studentEmail);
    } catch (err) {
        alert("Submission error: " + err.message);
        submitBtn.disabled = false; submitBtn.textContent = "Submit Registration"
    }
})

resendBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim().toLowerCase();
    const { error } = await supabase.auth.resend({ type: 'signup', email: email });
    if (error) alert("Error resending: " + error.message);
    else { alert("Verification code resent!"); startTimer(); }
});

document.getElementById('verifyBtn').onclick = async () => {
    const studentEmail = emailInput.value.trim().toLowerCase()
    const token = document.getElementById('otpCode').value.trim()
    const verifyBtn = document.getElementById('verifyBtn')
    const fn = capitalize(document.getElementById('firstname').value.trim())

    if (token.length < 6) return alert('Please enter the 6-digit code.')
    verifyBtn.disabled = true; verifyBtn.textContent = "Verifying..."

    const { data: authData, error: verifyError } = await supabase.auth.verifyOtp({
        email: studentEmail,
        token: token,
        type: 'signup'
    })

    if (verifyError) {
        verifyBtn.disabled = false; verifyBtn.textContent = "Verify & Complete"
        return alert('Verification Failed: ' + verifyError.message)
    }

    try {
        const { error: updateErr } = await supabase
            .from('students')
            .update({ auth_id: authData.user.id, is_confirmed: true })
            .eq('email', studentEmail);
            
        if (updateErr) throw updateErr;
        showFinalSuccess(fn)
    } catch (err) {
        alert("Verification update error: " + err.message);
        verifyBtn.disabled = false;
    }
}
</script>
</body>
</html>
